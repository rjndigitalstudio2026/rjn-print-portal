<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RJN PRINT PORTAL</title>
  <meta name="theme-color" content="#081321">
  <style>
    :root {
      --bg: #07111f;
      --card: #101d31;
      --text: #f5f8ff;
      --muted: #9db0c9;
      --accent: #6d7cff;
      --line: #263955;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(145deg, #07111f, #0b1630 55%, #10152a);
      color: var(--text);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #081321ee;
      border-bottom: 1px solid var(--line);
      padding: 16px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: .4px;
    }

    .brand small {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      margin-top: 5px;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    main {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }

    .card, .hero {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .hero {
      background: linear-gradient(120deg, #153d8b, #45229b);
    }

    button {
      border: 0;
      background: var(--accent);
      color: white;
      padding: 11px 15px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    input, select, textarea {
      display: block;
      width: 100%;
      margin: 8px 0 14px;
      padding: 12px;
      border: 1px solid #34446d;
      border-radius: 10px;
      background: #080f25;
      color: white;
    }

    label {
      display: block;
      margin: 12px 0;
    }

    p { color: #bdc9e8; line-height: 1.6; }
    .notice { padding: 12px; border-radius: 10px; }

    @media (max-width: 600px) {
      header { padding: 14px; }
      main { padding: 0 10px; }
      .brand { font-size: 17px; }
      .card, .hero { padding: 15px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      RJN PRINT PORTAL
      <small>All daily work at one portal</small>
    </div>
    <div class="nav" id="nav"></div>
  </header>

  <main id="app">
    <section class="hero">
      <h1>RJN PRINT PORTAL</h1>
      <p>Loading portal...</p>
    </section>
  </main>

  <script src="/app.js" defer></script>
</body>
</html>
