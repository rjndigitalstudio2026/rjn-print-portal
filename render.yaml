services:
  - type: web
    name: rjn-print-portal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@rjnprintportal.local
      - key: ADMIN_PASSWORD
        sync: false
