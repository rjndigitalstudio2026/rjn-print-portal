<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RJN PRINT PORTAL</title><style>
:root{--bg:#07111f;--card:#101d31;--card2:#15253e;--text:#f5f8ff;--muted:#9db0c9;--accent:#6d7cff;--ok:#37d39b;--danger:#ff6574;--line:#263955}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(145deg,#07111f,#0b1630 55%,#10152a);color:var(--text);min-height:100vh}header{position:sticky;top:0;z-index:10;background:#081321e8;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 5%;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;letter-spacing:.4px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}.nav{display:flex;gap:8px;flex-wrap:wrap}main{max-width:1200px;margin:24px auto;padding:0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card{background:linear-gradient(180deg,#101d31,#0d192b);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 14px 40px #0005;margin-bottom:14px}.stat b{font-size:26px}.muted{color:var(--muted);font-size:13px}.price{font-size:23px;font-weight:900;margin:12px 0}.btn{border:0;background:var(--accent);color:white;padding:10px 14px;border-radius:11px;font-weight:800;cursor:pointer}.btn.secondary{background:#243754}.btn.ok{background:#167a5b}.btn.danger{background:#9d3444}.btn:disabled{opacity:.5}.field{margin:11px 0}label{display:block;font-size:13px;color:#b8c7dc;margin-bottom:6px}input,textarea,select{width:100%;background:#0a1627;color:white;border:1px solid #314664;border-radius:10px;padding:11px;outline:none}textarea{min-height:90px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#20324d;color:#dce7fa;font-size:12px}.pill.ok{background:#124d3d}.pill.bad{background:#572431}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chat{max-height:420px;overflow:auto;background:#091524;border-radius:12px;padding:12px}.msg{padding:9px 11px;border-radius:12px;margin:7px 0;max-width:85%}.msg.customer{background:#172941}.msg.admin{background:#253a74;margin-left:auto}.notice{padding:10px 12px;border-radius:10px;background:#12243c;color:#c9d7ea}.hidden{display:none}.hero{padding:28px;border-radius:22px;background:radial-gradient(circle at top right,#3545a655,transparent 45%),#0d1b30;border:1px solid var(--line);margin-bottom:18px}.hero h1{margin:0 0 8px}.small{font-size:12px}@media(max-width:600px){header{align-items:flex-start;gap:8px}.brand{font-size:15px}main{padding:0 10px}.card{padding:14px}}
</style></head><body><header><div class="brand">RJN PRINT PORTAL<small>Customer & Admin Service Portal</small></div><div class="nav" id="nav"></div></header><main id="app"></main><script src="/app.js"></script></body></html>
